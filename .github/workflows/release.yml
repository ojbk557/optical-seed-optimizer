name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: sha256sum dist/*.whl > dist/SHA256SUMS.txt
      - name: Upload wheel and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
