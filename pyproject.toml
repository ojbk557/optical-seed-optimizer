[build-system]
requires = [
  "setuptools==75.3.2; python_version < '3.9'",
  "setuptools==82.0.1; python_version >= '3.9' and python_version < '3.10'",
  "setuptools==84.0.0; python_version >= '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "optical-seed-optimizer"
version = "0.1.0"
description = "Reproducible staged optimization of an optical Seed into a reviewable design package."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "OpticalSeedOptimizer contributors" }]
dependencies = ["PyYAML>=6.0,<7"]
keywords = ["optical-design", "lens-optimization", "zemax", "zos-api"]

[project.urls]
Homepage = "https://github.com/ojbk557/optical-seed-optimizer"
Repository = "https://github.com/ojbk557/optical-seed-optimizer"
Issues = "https://github.com/ojbk557/optical-seed-optimizer/issues"

[project.optional-dependencies]
dev = [
  "pytest==8.3.5; python_version < '3.9'",
  "pytest==8.4.2; python_version >= '3.9' and python_version < '3.10'",
  "pytest>=9.0.3,<10; python_version >= '3.10'",
  "ruff>=0.9,<1",
]
zosapi = ["pythonnet==2.5.2; python_version < '3.9' and platform_system == 'Windows'"]

[project.scripts]
seedopt = "optical_seed_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optical_seed_optimizer = ["data/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
