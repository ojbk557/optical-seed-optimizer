name: release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  wheel:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify tag and package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python scripts/validate_release.py --tag "$TAG"
      - name: Refuse to replace existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          asset_count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [ "$asset_count" -ne 0 ]; then
            echo "release $TAG already has $asset_count asset(s); refusing replacement" >&2
            exit 1
          fi
      - name: Install pinned build tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-release.txt
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build twice and require byte-identical wheels
        run: |
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir release-assets .
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir reproducibility-check .
          cmp release-assets/*.whl reproducibility-check/*.whl
      - name: Verify built wheel identity
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python scripts/validate_release.py --tag "$TAG" --dist-dir release-assets
      - run: (cd release-assets && sha256sum *.whl > SHA256SUMS.txt)
      - name: Upload wheel and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-assets/*
